<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwoPointFive Phaser 4</title>
  <style>
    /* Scale.EXPAND sizes the canvas from the parent element's bounding box, so the parent needs
       real dimensions of its own. A bare div in a centring flex container has none and collapses,
       or feeds back against the canvas it contains. */
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="dist/game.js"></script>
</body>
</html>
